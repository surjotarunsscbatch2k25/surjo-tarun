<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Surjo Tarun</title>
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="gallery-header">
    <div class="container">
      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> হোমে ফিরে যাও
      </a>
      <h1 class="page-title">Photo Gallery</h1>
      <p class="page-subtitle">Surjo Tarun • SSC Batch 2K25</p>
    </div>
  </header>

  <!-- Filter Tabs -->
  <section class="filter-section">
    <div class="container">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="school">School Life</button>
        <button class="filter-btn" data-filter="farewell">Farewell</button>
        <button class="filter-btn" data-filter="teachers">Teachers</button>
        <button class="filter-btn" data-filter="sports">Sports</button>
        <button class="filter-btn" data-filter="picnic">Picnic</button>
      </div>
    </div>
  </section>

  <!-- Album Cards Grid -->
  <section class="albums-section">
    <div class="container">
      <div class="albums-grid" id="albumsGrid">
        <!-- Album cards will be injected by JS -->
      </div>
    </div>
  </section>

  <!-- Single Album View (hidden by default) -->
  <section class="album-view hidden" id="albumView">
    <div class="container">
      <div class="album-view-header">
        <button class="back-to-albums" id="backToAlbums">
          <i class="fas fa-arrow-left"></i> সব অ্যালবাম
        </button>
        <div class="album-info">
          <h2 id="currentAlbumTitle">Album Title</h2>
          <p id="currentAlbumMeta">0 Photos</p>
        </div>
      </div>

      <div class="photos-grid" id="photosGrid">
        <!-- Photos will be injected by JS -->
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox hidden" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" title="Close (ESC)">
      <i class="fas fa-times"></i>
    </button>

    <button class="lightbox-nav prev" id="lightboxPrev" title="Previous">
      <i class="fas fa-chevron-left"></i>
    </button>

    <button class="lightbox-nav next" id="lightboxNext" title="Next">
      <i class="fas fa-chevron-right"></i>
    </button>

    <div class="lightbox-content">
      <img src="" alt="" id="lightboxImage" class="lightbox-img">
      <div class="lightbox-caption">
        <span id="lightboxCounter"></span>
        <span id="lightboxTitle"></span>
      </div>
    </div>

    <div class="lightbox-controls">
      <button id="zoomIn" title="Zoom In"><i class="fas fa-search-plus"></i></button>
      <button id="zoomOut" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
      <button id="zoomReset" title="Reset Zoom"><i class="fas fa-expand"></i></button>
    </div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
